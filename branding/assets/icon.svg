<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="EdgeMirror">
  <!-- Two panes across a vertical mirror axis  local | remote -->
  <rect width="32" height="32" rx="6" fill="#0c1116"/>
  <!-- Local pane -->
  <path d="M7 8h7v16H7z" fill="none" stroke="#6aa3d8" stroke-width="1.75" stroke-linejoin="round"/>
  <path d="M9.5 12h2M9.5 16h2M9.5 20h1.25" stroke="#6aa3d8" stroke-width="1.25" stroke-linecap="square"/>
  <!-- Mirror edge -->
  <line x1="16" y1="6" x2="16" y2="26" stroke="#3dbaa8" stroke-width="1.5" stroke-linecap="square"/>
  <!-- Remote pane (mirrored) -->
  <path d="M18 8h7v16h-7z" fill="none" stroke="#d4a574" stroke-width="1.75" stroke-linejoin="round"/>
  <path d="M20.5 12h2M20.5 16h2M20.5 20h1.25" stroke="#d4a574" stroke-width="1.25" stroke-linecap="square"/>
</svg>
