name: EdgeMirror Verify
description: >-
  Cloudflare Workers quality gate — run edgemirror verify before wrangler deploy.
  Fails on divergence or insufficient evidence; REMOTE_NOT_CONFIGURED when secrets absent.
author: EdgeMirror

inputs:
  local-only:
    description: Skip remote/preview execution (honest without CLOUDFLARE_* secrets)
    required: false
    default: "true"
  format:
    description: Report format (terminal|json|agent)
    required: false
    default: "agent"
  working-directory:
    description: Worker project directory
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Run EdgeMirror verify
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        EDGEMIRROR_FORMAT: ${{ inputs.format }}
        EDGEMIRROR_LOCAL_ONLY: ${{ inputs.local-only }}
      run: |
        # Inputs are passed via env to avoid shell interpolation / injection.
        set +e
        FORMAT="${EDGEMIRROR_FORMAT:-agent}"
        case "$FORMAT" in
          terminal|json|agent) ;;
          *) echo "Invalid format input"; exit 2 ;;
        esac
        ARGS=(verify --ci --format "$FORMAT")
        if [ "${EDGEMIRROR_LOCAL_ONLY:-true}" = "true" ]; then
          ARGS+=(--local)
        fi
        echo "::notice::EdgeMirror quality gate — verify before wrangler deploy"
        if command -v edgemirror >/dev/null 2>&1; then
          edgemirror "${ARGS[@]}"
        else
          npx --yes edgemirror "${ARGS[@]}"
        fi
        code=$?
        if [ "$code" -eq 1 ]; then
          echo "::error::EdgeMirror: confirmed divergence — do not deploy blind"
        elif [ "$code" -eq 3 ]; then
          echo "::error::EdgeMirror: insufficient evidence (e.g. REMOTE_NOT_CONFIGURED when remote required)"
        elif [ "$code" -ne 0 ]; then
          echo "::error::EdgeMirror: verify failed with exit $code"
        fi
        exit "$code"
