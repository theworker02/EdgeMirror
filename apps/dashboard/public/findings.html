<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EdgeMirror — Findings (DEMO)</title>
  <link rel="icon" href="./img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/edgemirror.css" />
</head>
<body class="em-app">
  <div class="em-shell">
    <nav class="em-nav" aria-label="Primary">
      <div class="em-nav__brand">
        <img src="./img/icon.svg" alt="" width="28" height="28" />
        <span>EdgeMirror</span>
      </div>
      <a href="./index.html">Overview</a>
      <a href="./projects.html">Projects</a>
      <a href="./runs.html">Runs</a>
      <a href="./findings.html" aria-current="page">Findings</a>
      <a href="./compatibility.html">Compatibility</a>
      <a href="./supercharger.html">Supercharger</a>
      <a href="./corpus.html">Corpus</a>
      <a href="./billing.html">Billing</a>
      <a href="./settings.html">Settings</a>
    </nav>
    <main class="em-main">
      <div class="em-banner-demo" role="note">DEMO dataset — not production metrics</div>
      <div>
        <h1 class="em-page-title">Findings</h1>
        <p class="em-page-sub">Parity findings with classification + product status. DEMO shell only.</p>
      </div>
      <div id="findings"></div><script type="module">const d=await fetch("./demo-data.json").then(r=>r.json());const f=d.findings[0];document.getElementById("findings").innerHTML=`<article class="em-finding" data-demo="true"><div class="em-finding__head"><span class="em-finding__id">${f.findingId}</span><span class="em-status em-status--demo">Demo</span><span class="em-status em-status--divergent">Divergent</span></div><div class="em-finding__meta">classification=${f.classification}</div><ul class="em-finding__diffs">${f.differences.map(x=>`<li><code>${x.path}</code></li>`).join("")}</ul></article>`</script>
    </main>
  </div>
</body>
</html>
